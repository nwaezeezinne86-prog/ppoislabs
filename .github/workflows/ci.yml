name: CI

on:
  push:
    branches: [ main, "feature/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: |
          flake8 lab1/src --max-line-length=150 --extend-ignore=E203,W503
          flake8 lab2/src --max-line-length=150 --extend-ignore=E203,W503

      - name: Run Lab 1 tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest lab1/tests \
            --cov=lab1/src \
            --cov-report=term-missing \
            --cov-fail-under=90

      - name: Run Lab 2 tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest lab2/tests \
            --cov=lab2/src \
            --cov-report=term-missing \
            --cov-fail-under=90

      - name: Build documentation
        run: |
          cd lab1/docs && sphinx-build -b html . _build/html && cd ../..
          cd lab2/docs && sphinx-build -b html . _build/html && cd ../..

      - name: Package artifact
        run: |
          mkdir -p dist
          cp -r lab1/src dist/lab1-src
          cp -r lab2/src dist/lab2-src
          cd dist && zip -r ../lab-src.zip lab1-src lab2-src

      - name: Upload artifact to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: lab-src.zip
